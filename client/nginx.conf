server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA-fallback ─────────────────────────────────────────────────
    # У нас клиентский роутинг (react-router). Файла /login на диске нет,
    # и без этой строки nginx вернул бы 404 при перезагрузке страницы.
    # try_files: попробуй файл -> попробуй папку -> отдай index.html,
    # а дальше React сам разберётся с адресом.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Кеширование ──────────────────────────────────────────────────
    # Vite добавляет хеш в имена файлов (index-a3f9c1.js). Меняется
    # содержимое — меняется имя, поэтому такие файлы можно кешировать
    # навсегда: старое имя браузер просто больше не запросит.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html кешировать НЕЛЬЗЯ: в нём ссылки на текущие хеши,
    # и закешированный index указывал бы на старые, уже удалённые файлы.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
